[project]
name = "clone-voice-backend"
version = "0.1.0"
description = "FastAPI backend for local voice cloning and speech processing"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.136.1",
    "numpy>=2.2.0",
    "pydantic-settings>=2.14.0",
    "python-multipart>=0.0.20",
    "soundfile>=0.13.1",
    "librosa>=0.11.0",
    "openai-whisper>=20250625",
    "sqlalchemy>=2.0.49",
    "alembic>=1.18.4",
    "yt-dlp[default]>=2026.8.19",
]

[project.optional-dependencies]
voxcpm = [
    "torchcodec>=0.7,<0.8",
    "voxcpm @ git+https://github.com/OpenBMB/VoxCPM.git",
]
dev = [
    "pytest>=9.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
